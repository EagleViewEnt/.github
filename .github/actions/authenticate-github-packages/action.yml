name: 'Setup GitHub Packages Authentication'
description: 'Configure NuGet authentication for GitHub Packages'
author: 'EagleViewEnt'

inputs:
  github-token:
    description: 'Per-run GITHUB_TOKEN. Sufficient when a repo only reads or publishes its own packages.'
    required: true
  packages-read-token:
    description: >
      Organization token used when the repo restores private packages published by
      sibling repositories. The per-run GITHUB_TOKEN is scoped to its own repository
      and cannot read those, so pass PACKAGES_READ_TOKEN here. Preferred over
      github-token when both are supplied.
    required: false
    default: ''
  require-cross-repo-read:
    description: >
      Set true when the repo genuinely depends on sibling packages. Turns a missing
      packages-read-token into an immediate, named failure instead of a wall of
      NU1301/403 errors much later in restore.
    required: false
    default: 'false'
  org-name:
    description: 'GitHub organization name'
    required: false
    default: 'EagleViewEnt'

runs:
  using: 'composite'
  steps:
    - name: Authenticate to GitHub Packages
      shell: pwsh
      env:
        PER_RUN_TOKEN: ${{ inputs.github-token }}
        CROSS_REPO_TOKEN: ${{ inputs.packages-read-token }}
      run: |
        Write-Host "🔐 Configuring GitHub Packages authentication..." -ForegroundColor Cyan

        # Prefer the org token when present: it can read sibling repos' private
        # packages, which the per-run token cannot. Repos that only touch their own
        # packages pass nothing and keep using GITHUB_TOKEN.
        $token = $env:CROSS_REPO_TOKEN
        if ([string]::IsNullOrWhiteSpace($token)) {
          if ('${{ inputs.require-cross-repo-read }}' -eq 'true') {
            Write-Host "::error::This repository restores private packages from sibling repositories, but no packages-read-token was supplied. Pass secrets.PACKAGES_READ_TOKEN to this action."
            exit 1
          }
          $token = $env:PER_RUN_TOKEN
          Write-Host "   Using the per-run GITHUB_TOKEN." -ForegroundColor Gray
        }
        else {
          Write-Host "   Using the organization packages-read token." -ForegroundColor Gray
        }

        $source = "https://nuget.pkg.github.com/${{ inputs.org-name }}/index.json"

        # Match the existing source by URL rather than by name. Repositories register
        # this feed under their own name, so removing a hardcoded 'github' source left
        # the real entry in place and the subsequent add failed as a duplicate URL.
        $existing = (dotnet nuget list source --format Short 2>&1) |
          Where-Object { $_ -match [regex]::Escape($source) }

        $name = $null
        if ($existing) {
          # 'list source --format Detailed' pairs each name with the URL on the next line.
          $lines = dotnet nuget list source --format Detailed 2>&1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match [regex]::Escape($source)) {
              $name = ($lines[$i - 1] -replace '^\s*\d+\.\s*', '' -replace '\s*\[.*$', '').Trim()
              break
            }
          }
        }

        if ($name) {
          Write-Host "   Updating credentials for existing source: $name" -ForegroundColor Gray
          dotnet nuget update source $name `
            --source $source `
            --username ${{ github.actor }} `
            --password $token `
            --store-password-in-clear-text
        }
        else {
          Write-Host "   Adding source: $source" -ForegroundColor Gray
          dotnet nuget add source $source `
            --name EagleViewEnt `
            --username ${{ github.actor }} `
            --password $token `
            --store-password-in-clear-text
        }

        if ($LASTEXITCODE -eq 0) {
          Write-Host "✅ Authentication configured successfully" -ForegroundColor Green
        } else {
          Write-Error "❌ Failed to configure authentication"
          exit $LASTEXITCODE
        }

branding:
  icon: 'lock'
  color: 'blue'