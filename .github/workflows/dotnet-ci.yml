name: .NET CI/CD

on:
  workflow_call:
    inputs:
      # Config-based mode
      config-file:
        description: 'Path to workflow-config.json'
        required: false
        type: string

      # Runner selection.
      #
      # Defaults to windows-latest so every existing repo keeps its current behavior.
      # Repos with no Windows dependency (for example Blazor, which is pure net10.0)
      # can pass ubuntu-latest: Linux runners provision faster and are billed at 1x
      # instead of 2x. Setup .NET measured at 250s / 37% of total job time on Windows.
      #
      # This stays a per-repo choice rather than an org-wide default. EagleViewEnt/Utilities
      # must stay on Windows: it depends on System.Security.Cryptography.ProtectedData
      # (Windows DPAPI) via Utilities.Encryption, which throws PlatformNotSupportedException
      # on Linux. A trial run measured 248 such failures cascading through Encryption,
      # Financial, Serialization, Localization and EFCore. Note the constraint is DPAPI,
      # not the Utilities.Windows project: that one targets plain net10.0, guards its
      # Windows APIs with [SupportedOSPlatform], and its tests pass on Linux.
      runner-os:
        description: 'Runner image for the .NET jobs (windows-latest or ubuntu-latest)'
        required: false
        type: string
        default: 'windows-latest'
      
      # Legacy mode inputs (backward compatibility)
      dotnet-version:
        description: 'Legacy: .NET SDK version'
        required: false
        type: string
      build-configuration:
        description: 'Legacy: Build configuration'
        required: false
        type: string
        default: 'Release'
      run-tests:
        description: 'Legacy: Whether to run tests'
        required: false
        type: boolean
        default: true
      enable-code-coverage:
        description: 'Legacy: Whether to enable code coverage'
        required: false
        type: boolean
        default: false
      publish-packages:
        description: 'Legacy: Whether to publish packages'
        required: false
        type: boolean
        default: false
      package-projects:
        description: 'Legacy: JSON array of project paths'
        required: false
        type: string
      org-name:
        description: 'Legacy: Organization name'
        required: false
        type: string

jobs:
  # Auto-detect build mode from commit message or ref
  detect-mode:
    name: Detect Build Mode
    runs-on: windows-latest
    outputs:
      incremental: ${{ steps.mode.outputs.incremental }}
      reason: ${{ steps.mode.outputs.reason }}
    steps:
      - name: Determine build mode
        id: mode
        shell: pwsh
        # The commit message is untrusted input and must not be interpolated into the
        # script body: any quote, backtick, or newline it contains becomes PowerShell
        # syntax. A multi-line message with an embedded quote broke every tag build with
        # "Unexpected token ... in expression or statement". Passing it through the
        # environment keeps it as data.
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          SOURCE_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $commitMsg = $env:COMMIT_MESSAGE
          $ref = $env:SOURCE_REF
          $eventName = $env:EVENT_NAME
          
          Write-Host "=============================================="
          Write-Host "   Build Mode Auto-Detection"
          Write-Host "=============================================="
          Write-Host "Event: $eventName"
          Write-Host "Ref: $ref"
          Write-Host "Commit Message: $commitMsg"
          Write-Host ""
          
          # Check for full build triggers
          $fullBuild = $false
          $reason = ""
          
          if ($eventName -eq 'workflow_dispatch') {
            $fullBuild = $true
            $reason = "Manual run (workflow_dispatch) always builds everything"
          } elseif ($commitMsg -match '\[Release\]' -or $commitMsg -match '\[FullBuild\]') {
            $fullBuild = $true
            $reason = "Commit message contains [Release] or [FullBuild]"
          } elseif ($ref -match '^refs/tags/v') {
            $fullBuild = $true
            $reason = "Version tag push (refs/tags/v*)"
          } elseif ($ref -match '^refs/tags/.*-v') {
            $fullBuild = $true
            $reason = "Project version tag push (*-v*)"
          } elseif ($ref -match 'release/') {
            $fullBuild = $true
            $reason = "Release branch push"
          }
          
          if ($fullBuild) {
            Write-Host "[FULL BUILD] Full build mode enabled"
            Write-Host "Reason: $reason"
            echo "incremental=false" >> $env:GITHUB_OUTPUT
            echo "reason=$reason" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "[INCREMENTAL] Incremental build mode (default)"
            Write-Host "Reason: Normal development - build only changed projects"
            echo "incremental=true" >> $env:GITHUB_OUTPUT
            echo "reason=Auto-incremental (default for normal development)" >> $env:GITHUB_OUTPUT
          }
          
          Write-Host "=============================================="

  # Detect changed projects (only if incremental mode)
  detect-changes:
    needs: detect-mode
    if: needs.detect-mode.outputs.incremental == 'true'
    uses: ./.github/workflows/_detect-changes.yml
    with:
      base-ref: 'main'

  setup:
    needs: [detect-mode, detect-changes]
    # FIXED: Only run if we're in full build mode OR if incremental detected actual code changes
    if: always() && needs.detect-mode.result == 'success' && (needs.detect-mode.outputs.incremental == 'false' || needs.detect-changes.outputs.has-changes == 'true')
    uses: ./.github/workflows/_setup-and-discovery.yml
    with:
      config-file: ${{ inputs.config-file }}
      dotnet-version: ${{ inputs.dotnet-version }}
      build-configuration: ${{ inputs.build-configuration }}
      run-tests: ${{ inputs.run-tests }}
      enable-code-coverage: ${{ inputs.enable-code-coverage }}
      publish-packages: ${{ inputs.publish-packages }}
      package-projects: ${{ inputs.package-projects }}
      org-name: ${{ inputs.org-name }}

  build:
    needs: [setup, detect-mode, detect-changes]
    if: always() && needs.setup.result == 'success'
    uses: ./.github/workflows/_build.yml
    with:
      dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
      build-config: ${{ needs.setup.outputs.build-config }}
      runner-os: ${{ inputs.runner-os }}
      # FIXED: Use the value directly when all conditions pass, or fall back to empty
      # The key is: ONLY pass the array when incremental mode succeeded with actual changes
      filter-projects: ${{ needs.detect-mode.outputs.incremental == 'true' && needs.detect-changes.result == 'success' && needs.detect-changes.outputs.has-changes == 'true' && needs.detect-changes.outputs.changed-projects != '[]' && needs.detect-changes.outputs.changed-projects || '[]' }}
      run-tests: ${{ needs.setup.outputs.run-tests }}
      code-coverage: ${{ needs.setup.outputs.code-coverage }}
      # Use changed-test-projects for testing (includes auto-discovered test projects for changed source projects)
      test-filter-projects: ${{ needs.detect-mode.outputs.incremental == 'true' && needs.detect-changes.result == 'success' && needs.detect-changes.outputs.has-changes == 'true' && needs.detect-changes.outputs.changed-test-projects != '[]' && needs.detect-changes.outputs.changed-test-projects || '[]' }}

  package:
    needs: [setup, build, detect-mode, detect-changes]
    if: always() && needs.setup.outputs.publish-packages == 'true' && needs.build.result == 'success'
    uses: ./.github/workflows/_package.yml
    secrets: inherit
    with:
      dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
      build-config: ${{ needs.setup.outputs.build-config }}
      # Packaging ALWAYS uses the full packable set, never the incremental subset.
      # MinVer derives a new version for every project on every commit, so packing
      # only changed projects publishes packages whose sibling dependencies were
      # never pushed at that height -> NU1100 on consumers. Build/test stay
      # incremental for speed; packaging must stay complete for correctness.
      packable-projects: ${{ needs.setup.outputs.packable-projects }}
      org-name: ${{ needs.setup.outputs.org-name }}
      runner-os: ${{ inputs.runner-os }}

  summary:
    needs: [setup, build, package, detect-mode, detect-changes]
    if: always()
    uses: ./.github/workflows/_summary.yml
    with:
      mode: ${{ needs.setup.outputs.mode }}
      dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
      build-config: ${{ needs.setup.outputs.build-config }}
      packable-projects: ${{ needs.setup.outputs.packable-projects }}
      setup-result: ${{ needs.setup.result }}
      build-result: ${{ needs.build.result }}
      # Build and test now run in one job, so they share a single result. Tests that
      # were skipped (run-tests false, or no test projects in the changed set) are
      # reported by the build job's own log rather than a distinct job status.
      test-result: ${{ needs.build.result }}
      package-result: ${{ needs.package.result }}
      # Pass build mode information
      incremental-build: ${{ needs.detect-mode.outputs.incremental }}
      incremental-reason: ${{ needs.detect-mode.outputs.reason }}
      changed-projects: ${{ (needs.detect-changes.result == 'success') && needs.detect-changes.outputs.changed-projects || '[]' }}
