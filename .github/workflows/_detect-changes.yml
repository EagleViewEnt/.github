name: Detect Changes

on:
  workflow_call:
    inputs:
      base-ref:
        description: 'Base reference for comparison (e.g., main)'
        required: false
        type: string
        default: 'main'
    outputs:
      changed-projects:
        description: 'JSON array of changed project paths'
        value: ${{ jobs.detect.outputs.changed-projects }}
      has-changes:
        description: 'Whether any projects have changes'
        value: ${{ jobs.detect.outputs.has-changes }}
      changed-src-projects:
        description: 'JSON array of changed source projects only'
        value: ${{ jobs.detect.outputs.changed-src-projects }}
      changed-test-projects:
        description: 'JSON array of changed test projects only'
        value: ${{ jobs.detect.outputs.changed-test-projects }}

jobs:
  detect:
    name: Detect Changed Projects
    runs-on: windows-latest
    outputs:
      changed-projects: ${{ steps.detect.outputs.changed-projects }}
      has-changes: ${{ steps.detect.outputs.has-changes }}
      changed-src-projects: ${{ steps.detect.outputs.changed-src-projects }}
      changed-test-projects: ${{ steps.detect.outputs.changed-test-projects }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for comparison
      
      - name: Detect changed projects
        id: detect
        shell: pwsh
        run: |
          Write-Host "================================================"
          Write-Host "   Detecting Changed Projects"
          Write-Host "================================================"
          Write-Host ""
          
          # Determine base reference based on event type
          $baseRef = "${{ inputs.base-ref }}"
          $compareRef = "HEAD"
          
          if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            # PR: Compare PR branch against target branch
            $baseRef = "${{ github.event.pull_request.base.sha }}"
            Write-Host "?? Pull Request Mode: Comparing to $baseRef"
          } else {
            # Push: Compare current commit against parent (previous commit)
            # This ensures we see the actual changes in this push
            Write-Host "?? Push Mode: Comparing HEAD against parent commit"
            $baseRef = "HEAD^"
          }
          
          # Get changed files
          Write-Host ""
          Write-Host "?? Getting changed files..."
          try {
            $changedFiles = git diff --name-only $baseRef $compareRef 2>&1
            if ($LASTEXITCODE -ne 0) {
              Write-Host "??  Git diff failed, trying alternative method"
              # Fallback: compare against origin/main
              $baseRef = "origin/${{ inputs.base-ref }}"
              $changedFiles = git diff --name-only $baseRef HEAD 2>&1
              if ($LASTEXITCODE -ne 0) {
                Write-Host "??  Fallback also failed, using HEAD~1"
                $changedFiles = git diff --name-only HEAD~1 HEAD
              }
            }
          } catch {
            Write-Host "??  Git diff exception: $($_.Exception.Message)"
            $changedFiles = @()
          }
          
          if (-not $changedFiles -or $changedFiles.Count -eq 0) {
            Write-Host "??  No changed files detected"
            echo "changed-projects=[]" >> $env:GITHUB_OUTPUT
            echo "has-changes=false" >> $env:GITHUB_OUTPUT
            echo "changed-src-projects=[]" >> $env:GITHUB_OUTPUT
            echo "changed-test-projects=[]" >> $env:GITHUB_OUTPUT
            exit 0
          }
          
          Write-Host "?? Changed files: $($changedFiles.Count)"
          $changedFiles | ForEach-Object { Write-Host "  - $_" }
          Write-Host ""
          
          # Find all project files with their directories
          Write-Host "?? Finding all projects..."
          $allProjects = Get-ChildItem -Path . -Filter "*.csproj" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            $relativePath = $_.FullName.Replace("$PWD\", "").Replace("$PWD/", "").Replace("\", "/")
            $relativeDir = $_.Directory.FullName.Replace("$PWD\", "").Replace("$PWD/", "").Replace("\", "/")
            @{
              Path = $relativePath
              Directory = $relativeDir
              Name = $_.BaseName
            }
          }
          Write-Host "?? Found $($allProjects.Count) total projects"
          Write-Host ""
          
          # Map changed files to projects
          $changedProjects = @()
          $changedSrcProjects = @()
          $changedTestProjects = @()
          
          Write-Host "?? Mapping changed files to projects..."
          foreach ($file in $changedFiles) {
            # Normalize path separators to forward slash for comparison
            $normalizedFile = $file.Replace("\", "/")
            
            Write-Host "  Checking: $normalizedFile"
            
            # Find which project this file belongs to by checking if file path starts with project directory
            $matchedProject = $null
            foreach ($project in $allProjects) {
              if ($normalizedFile.StartsWith($project.Directory + "/")) {
                $matchedProject = $project
                break
              }
            }
            
            if ($matchedProject) {
              $projectPath = $matchedProject.Path
              
              # Add to changed projects if not already there
              if ($changedProjects -notcontains $projectPath) {
                $changedProjects += $projectPath
                Write-Host "    ? Mapped to: $projectPath"
                
                # Categorize by type
                if ($projectPath -like "*/tests/*" -or $projectPath -like "*.Tests.csproj") {
                  $changedTestProjects += $projectPath
                } else {
                  $changedSrcProjects += $projectPath
                }
              }
            } else {
              Write-Host "    ??  No project found (workflow/config file?)"
            }
          }
          
          Write-Host ""
          Write-Host "?? Checking for related test projects..."
          # Include test projects for changed source projects
          foreach ($srcProject in $changedSrcProjects) {
            # Extract project name (e.g., "EagleViewEnt.Utilities.Core")
            $projectName = [System.IO.Path]::GetFileNameWithoutExtension($srcProject)
            
            # Look for corresponding test project pattern
            $testProjectPattern = "*$projectName.Tests.csproj"
            $testProject = $allProjects | Where-Object { 
              $_.Path -like $testProjectPattern -and ($_.Path -like "*/tests/*" -or $_.Path -like "*.Tests.csproj")
            } | Select-Object -First 1
            
            if ($testProject -and $changedProjects -notcontains $testProject.Path) {
              $changedProjects += $testProject.Path
              $changedTestProjects += $testProject.Path
              Write-Host "  ? Auto-included test: $($testProject.Path)"
            }
          }
          
          Write-Host ""
          Write-Host "================================================"
          Write-Host "   Detection Results"
          Write-Host "================================================"
          Write-Host "Total changed projects: $($changedProjects.Count)"
          Write-Host "  Source projects: $($changedSrcProjects.Count)"
          Write-Host "  Test projects: $($changedTestProjects.Count)"
          Write-Host ""
          
          if ($changedProjects.Count -gt 0) {
            Write-Host "?? Changed Projects:"
            $changedProjects | ForEach-Object { Write-Host "  - $_" }
            Write-Host ""
          }
          
          # Convert to JSON
          $changedProjectsJson = if ($changedProjects.Count -gt 0) { 
            $changedProjects | ConvertTo-Json -Compress -AsArray
          } else { 
            "[]" 
          }
          
          $changedSrcProjectsJson = if ($changedSrcProjects.Count -gt 0) {
            $changedSrcProjects | ConvertTo-Json -Compress -AsArray
          } else {
            "[]"
          }
          
          $changedTestProjectsJson = if ($changedTestProjects.Count -gt 0) {
            $changedTestProjects | ConvertTo-Json -Compress -AsArray
          } else {
            "[]"
          }
          
          # Output results
          $hasChanges = $changedProjects.Count -gt 0
          echo "changed-projects=$changedProjectsJson" >> $env:GITHUB_OUTPUT
          echo "changed-src-projects=$changedSrcProjectsJson" >> $env:GITHUB_OUTPUT
          echo "changed-test-projects=$changedTestProjectsJson" >> $env:GITHUB_OUTPUT
          echo "has-changes=$hasChanges" >> $env:GITHUB_OUTPUT
          
          Write-Host "? Detection complete!"
          Write-Host "   has-changes: $hasChanges"
          Write-Host "================================================"
