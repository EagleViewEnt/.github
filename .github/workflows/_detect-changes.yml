name: Detect Changes

on:
  workflow_call:
    inputs:
      base-ref:
        description: 'Base reference for comparison (e.g., main)'
        required: false
        type: string
        default: 'main'
    outputs:
      changed-projects:
        description: 'JSON array of changed project paths'
        value: ${{ jobs.detect.outputs.changed-projects }}
      has-changes:
        description: 'Whether any projects have changes'
        value: ${{ jobs.detect.outputs.has-changes }}
      changed-src-projects:
        description: 'JSON array of changed source projects only'
        value: ${{ jobs.detect.outputs.changed-src-projects }}
      changed-test-projects:
        description: 'JSON array of changed test projects only'
        value: ${{ jobs.detect.outputs.changed-test-projects }}

jobs:
  detect:
    name: Detect Changed Projects
    runs-on: windows-latest
    outputs:
      changed-projects: ${{ steps.detect.outputs.changed-projects }}
      has-changes: ${{ steps.detect.outputs.has-changes }}
      changed-src-projects: ${{ steps.detect.outputs.changed-src-projects }}
      changed-test-projects: ${{ steps.detect.outputs.changed-test-projects }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for comparison
      
      - name: Detect changed projects
        id: detect
        shell: pwsh
        run: |
          Write-Host "================================================"
          Write-Host "   Detecting Changed Projects"
          Write-Host "================================================"
          Write-Host ""
          
          # Define file extensions that should trigger builds
          $codeExtensions = @(
            '.cs', '.csproj', '.sln',           # C# files
            '.config', '.json', '.xml',         # Config files
            '.resx', '.xaml',                   # Resource files
            '.cshtml', '.razor',                # Web files
            '.sql', '.edmx',                    # Database files
            '.tt', '.t4'                        # Code generation
          )
          
          # Define patterns that should be IGNORED (won't trigger builds)
          $ignorePatterns = @(
            '*.md', '*.txt', '*.pdf',           # Documentation
            '*.png', '*.jpg', '*.gif', '*.svg', # Images
            '*.ico', '*.bmp',                   # Icons
            'LICENSE', 'CHANGELOG',             # Meta files
            '.gitignore', '.editorconfig',      # Git/editor config
            'docs/*', '*.docx'                  # Documentation folders
          )
          
          # Determine base reference based on event type
          $baseRef = "${{ inputs.base-ref }}"
          $compareRef = "HEAD"
          
          if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            # PR: Compare PR branch against target branch
            $baseRef = "${{ github.event.pull_request.base.sha }}"
            Write-Host "[PR] Pull Request Mode: Comparing to $baseRef"
          } else {
            # Push: Compare current commit against parent (previous commit)
            # This ensures we see the actual changes in this push
            Write-Host "[PUSH] Push Mode: Comparing HEAD against parent commit"
            $baseRef = "HEAD^"
          }
          
          # Get changed files
          Write-Host ""
          Write-Host "[SCAN] Getting changed files..."
          try {
            $changedFiles = git diff --name-only $baseRef $compareRef 2>&1
            if ($LASTEXITCODE -ne 0) {
              Write-Host "[WARN] Git diff failed, trying alternative method"
              # Fallback: compare against origin/main
              $baseRef = "origin/${{ inputs.base-ref }}"
              $changedFiles = git diff --name-only $baseRef HEAD 2>&1
              if ($LASTEXITCODE -ne 0) {
                Write-Host "[WARN] Fallback also failed, using HEAD~1"
                $changedFiles = git diff --name-only HEAD~1 HEAD
              }
            }
          } catch {
            Write-Host "[ERROR] Git diff exception: $($_.Exception.Message)"
            $changedFiles = @()
          }
          
          if (-not $changedFiles -or $changedFiles.Count -eq 0) {
            Write-Host "[SKIP] No changed files detected"
            echo "changed-projects=[]" >> $env:GITHUB_OUTPUT
            echo "has-changes=false" >> $env:GITHUB_OUTPUT
            echo "changed-src-projects=[]" >> $env:GITHUB_OUTPUT
            echo "changed-test-projects=[]" >> $env:GITHUB_OUTPUT
            exit 0
          }
          
          Write-Host "[INFO] Total changed files: $($changedFiles.Count)"
          Write-Host ""
          
          # Filter out non-code files
          Write-Host "[FILTER] Filtering for code files only..."
          $codeFiles = @()
          $ignoredFiles = @()
          
          foreach ($file in $changedFiles) {
            $ext = [System.IO.Path]::GetExtension($file).ToLower()
            $fileName = [System.IO.Path]::GetFileName($file)
            $shouldIgnore = $false
            
            # Check ignore patterns
            foreach ($pattern in $ignorePatterns) {
              if ($pattern.Contains('*')) {
                # Wildcard pattern
                $regex = '^' + [regex]::Escape($pattern).Replace('\*', '.*') + '$'
                if ($file -match $regex -or $fileName -match $regex) {
                  $shouldIgnore = $true
                  break
                }
              } elseif ($file -like "*$pattern*" -or $fileName -like "*$pattern*") {
                $shouldIgnore = $true
                break
              }
            }
            
   
