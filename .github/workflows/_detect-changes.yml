name: Detect Changes

on:
  workflow_call:
    inputs:
      base-ref:
        description: 'Base reference for comparison (e.g., main)'
        required: false
        type: string
        default: 'main'
    outputs:
      changed-projects:
        description: 'JSON array of changed project paths'
        value: ${{ jobs.detect.outputs.changed-projects }}
      has-changes:
        description: 'Whether any projects have changes'
        value: ${{ jobs.detect.outputs.has-changes }}
      changed-src-projects:
        description: 'JSON array of changed source projects only'
        value: ${{ jobs.detect.outputs.changed-src-projects }}
      changed-test-projects:
        description: 'JSON array of changed test projects only'
        value: ${{ jobs.detect.outputs.changed-test-projects }}

jobs:
  detect:
    name: Detect Changed Projects
    runs-on: windows-latest
    outputs:
      changed-projects: ${{ steps.detect.outputs.changed-projects }}
      has-changes: ${{ steps.detect.outputs.has-changes }}
      changed-src-projects: ${{ steps.detect.outputs.changed-src-projects }}
      changed-test-projects: ${{ steps.detect.outputs.changed-test-projects }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for comparison
      
      - name: Detect changed projects
        id: detect
        shell: pwsh
        run: |
          Write-Host "================================================"
          Write-Host "   Detecting Changed Projects"
          Write-Host "================================================"
          Write-Host ""
          
          # Define file extensions that should trigger builds
          $codeExtensions = @(
            '.cs', '.csproj', '.sln',           # C# files
            '.config', '.json', '.xml',         # Config files
            '.resx', '.xaml',                   # Resource files
            '.cshtml', '.razor',                # Web files
            '.sql', '.edmx',                    # Database files
            '.tt', '.t4'                        # Code generation
          )
          
          # Define patterns that should be IGNORED (won't trigger builds)
          $ignorePatterns = @(
            '*.md', '*.txt', '*.pdf',           # Documentation
            '*.png', '*.jpg', '*.gif', '*.svg', # Images
            '*.ico', '*.bmp',                   # Icons
            'LICENSE', 'CHANGELOG',             # Meta files
            '.gitignore', '.editorconfig',      # Git/editor config
            'docs/*', '*.docx'                  # Documentation folders
          )
          
          # Determine base reference based on event type
          $baseRef = '${{ inputs.base-ref }}'
          $compareRef = "HEAD"
          
          if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            # PR: Compare PR branch against target branch
            $baseRef = '${{ github.event.pull_request.base.sha }}'
            Write-Host "[PR] Pull Request Mode: Comparing to $baseRef"
          } else {
            # Push: Compare current commit against parent (previous commit)
            # This ensures we see the actual changes in this push
            Write-Host "[PUSH] Push Mode: Comparing HEAD against parent commit"
            $baseRef = "HEAD^"
          }
          
          # Get changed files
          Write-Host ""
          Write-Host "[SCAN] Getting changed files..."
          try {
            $changedFiles = git diff --name-only $baseRef $compareRef 2>&1
            if ($LASTEXITCODE -ne 0) {
              Write-Host "[WARN] Git diff failed, trying alternative method"
              # Fallback: compare against origin/main
              $baseRef = "origin/${{ inputs.base-ref }}"
              $changedFiles = git diff --name-only $baseRef HEAD 2>&1
              if ($LASTEXITCODE -ne 0) {
                Write-Host "[WARN] Fallback also failed, using HEAD~1"
                $changedFiles = git diff --name-only HEAD~1 HEAD
              }
            }
          } catch {
            Write-Host "[ERROR] Git diff exception: $($_.Exception.Message)"
            $changedFiles = @()
          }
          
          if (-not $changedFiles -or $changedFiles.Count -eq 0) {
            Write-Host "[SKIP] No changed files detected"
            echo "changed-projects=[]" >> $env:GITHUB_OUTPUT
            echo "has-changes=false" >> $env:GITHUB_OUTPUT
            echo "changed-src-projects=[]" >> $env:GITHUB_OUTPUT
            echo "changed-test-projects=[]" >> $env:GITHUB_OUTPUT
            exit 0
          }
          
          Write-Host "[INFO] Total changed files: $($changedFiles.Count)"
          Write-Host ""
          
          # Filter out non-code files
          Write-Host "[FILTER] Filtering for code files only..."
          $codeFiles = @()
          $ignoredFiles = @()
          
          foreach ($file in $changedFiles) {
            $ext = [System.IO.Path]::GetExtension($file).ToLower()
            $fileName = [System.IO.Path]::GetFileName($file)
            $shouldIgnore = $false

            # Check ignore patterns
            foreach ($pattern in $ignorePatterns) {
              if ($pattern.Contains('*')) {
                # Wildcard pattern
                $regex = '^' + [regex]::Escape($pattern).Replace('\*', '.*') + '$'
                if ($file -match $regex -or $fileName -match $regex) {
                  $shouldIgnore = $true
                  break
                }
              } elseif ($file -like "*$pattern*" -or $fileName -like "*$pattern*") {
                $shouldIgnore = $true
                break
              }
            }
            
            if ($shouldIgnore) {
              $ignoredFiles += $file
              Write-Host "[IGNORE] $file"
            } elseif ($codeExtensions -contains $ext) {
              $codeFiles += $file
              Write-Host "[MATCH] $file"
            } else {
              $ignoredFiles += $file
              Write-Host "[IGNORE] $file (extension not in code list)"
            }
          }
          
          Write-Host ""
          Write-Host "[RESULT] Code files: $($codeFiles.Count)"
          Write-Host "[RESULT] Ignored files: $($ignoredFiles.Count)"
          Write-Host ""
          
          if ($codeFiles.Count -eq 0) {
            Write-Host "[SKIP] No code files changed (only docs/images/etc.)"
            echo "changed-projects=[]" >> $env:GITHUB_OUTPUT
            echo "has-changes=false" >> $env:GITHUB_OUTPUT
            echo "changed-src-projects=[]" >> $env:GITHUB_OUTPUT
            echo "changed-test-projects=[]" >> $env:GITHUB_OUTPUT
            exit 0
          }
          
          # Find all .csproj files in the repository
          Write-Host "[SCAN] Finding all projects..."
          $allProjects = Get-ChildItem -Path . -Recurse -Filter "*.csproj" | ForEach-Object {
            $_.FullName.Replace($PWD.Path + '\', '').Replace('\', '/')
          }
          Write-Host "[INFO] Total projects found: $($allProjects.Count)"
          
          # Map changed files to their projects
          Write-Host ""
          Write-Host "[MAP] Mapping changed files to projects..."
          $affectedProjects = @()
          
          foreach ($file in $codeFiles) {
            $fileDir = [System.IO.Path]::GetDirectoryName($file).Replace('\', '/')
            
            # Find the closest project file
            $segments = $fileDir.Split('/')
            for ($i = $segments.Count; $i -ge 0; $i--) {
              $searchPath = ($segments[0..$i] -join '/') + '/*.csproj'
              $projectFile = $allProjects | Where-Object { $_ -like $searchPath } | Select-Object -First 1
              
              if ($projectFile) {
                if ($affectedProjects -notcontains $projectFile) {
                  $affectedProjects += $projectFile
                  Write-Host "[PROJECT] $file -> $projectFile"
                }
                break
              }
            }
          }
          
          Write-Host ""
          Write-Host "[RESULT] Affected projects: $($affectedProjects.Count)"
          
          if ($affectedProjects.Count -eq 0) {
            Write-Host "[SKIP] No projects affected by changes"
            echo "changed-projects=[]" >> $env:GITHUB_OUTPUT
            echo "has-changes=false" >> $env:GITHUB_OUTPUT
            echo "changed-src-projects=[]" >> $env:GITHUB_OUTPUT
            echo "changed-test-projects=[]" >> $env:GITHUB_OUTPUT
            exit 0
          }
          
          # Categorize projects into source and test projects
          $srcProjects = @()
          $testProjects = @()
          
          foreach ($project in $affectedProjects) {
            if ($project -match '[\\/]tests[\\/]' -or $project -match '\.Tests[\\/]' -or $project -match '\.Tests\.csproj$') {
              $testProjects += $project
              Write-Host "[TEST] $project"
            } else {
              $srcProjects += $project
              Write-Host "[SRC] $project"
            }
          }
          
          Write-Host ""
          Write-Host "[RESULT] Source projects: $($srcProjects.Count)"
          Write-Host "[RESULT] Test projects: $($testProjects.Count)"
          
          # For each changed source project, find and include corresponding test projects
          Write-Host ""
          Write-Host "[MAP] Finding test projects for changed source projects..."
          $additionalTestProjects = @()
          
          foreach ($srcProj in $srcProjects) {
            # Extract project name from path (e.g., "EagleViewEnt.Utilities.External" from "src/External/EagleViewEnt.Utilities.External.csproj")
            $srcProjName = [System.IO.Path]::GetFileNameWithoutExtension($srcProj)
            
            # Look for matching test projects (e.g., "EagleViewEnt.Utilities.External.Tests.csproj")
            $matchingTestProj = $allProjects | Where-Object { 
              $_ -match '[\\/]tests[\\/]' -and 
              $_ -match [regex]::Escape($srcProjName) -and
              $_ -match '\.Tests\.csproj$'
            } | Select-Object -First 1
            
            if ($matchingTestProj -and ($testProjects -notcontains $matchingTestProj) -and ($additionalTestProjects -notcontains $matchingTestProj)) {
              $additionalTestProjects += $matchingTestProj
              Write-Host "[TEST-RELATED] $srcProj -> $matchingTestProj"
            }
          }
          
          # Add related test projects to the main test projects list
          if ($additionalTestProjects.Count -gt 0) {
            Write-Host ""
            Write-Host "[INFO] Adding $($additionalTestProjects.Count) related test project(s)"
            $testProjects += $additionalTestProjects
            $affectedProjects += $additionalTestProjects
          }
          
          Write-Host ""
          Write-Host "[FINAL] Total affected projects: $($affectedProjects.Count)"
          Write-Host "[FINAL] Source projects: $($srcProjects.Count)"
          Write-Host "[FINAL] Test projects: $($testProjects.Count)"
          Write-Host ""
          
          # Convert to JSON arrays
          $changedProjectsJson = $affectedProjects | ConvertTo-Json -Compress
          $srcProjectsJson = $srcProjects | ConvertTo-Json -Compress
          $testProjectsJson = $testProjects | ConvertTo-Json -Compress
          
          # Handle single-item arrays (ConvertTo-Json doesn't wrap single items in array brackets)
          if ($affectedProjects.Count -eq 1) { $changedProjectsJson = "[$changedProjectsJson]" }
          if ($srcProjects.Count -eq 1) { $srcProjectsJson = "[$srcProjectsJson]" }
          if ($testProjects.Count -eq 1) { $testProjectsJson = "[$testProjectsJson]" }
          
          # Handle empty arrays
          if ($affectedProjects.Count -eq 0) { $changedProjectsJson = "[]" }
          if ($srcProjects.Count -eq 0) { $srcProjectsJson = "[]" }
          if ($testProjects.Count -eq 0) { $testProjectsJson = "[]" }
          
          # Output results
          Write-Host "================================================"
          Write-Host "   OUTPUT"
          Write-Host "================================================"
          Write-Host "changed-projects: $changedProjectsJson"
          Write-Host "has-changes: true"
          Write-Host "changed-src-projects: $srcProjectsJson"
          Write-Host "changed-test-projects: $testProjectsJson"
          Write-Host "================================================"
          
          echo "changed-projects=$changedProjectsJson" >> $env:GITHUB_OUTPUT
          echo "has-changes=true" >> $env:GITHUB_OUTPUT
          echo "changed-src-projects=$srcProjectsJson" >> $env:GITHUB_OUTPUT
          echo "changed-test-projects=$testProjectsJson" >> $env:GITHUB_OUTPUT
