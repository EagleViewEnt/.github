name: Package

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: '.NET SDK version'
        required: true
        type: string
      build-config:
        description: 'Build configuration'
        required: true
        type: string
      packable-projects:
        description: 'JSON array of projects to package'
        required: true
        type: string
      org-name:
        description: 'Organization name for publishing'
        required: true
        type: string
      runner-os:
        description: 'Runner image to execute this job on'
        required: false
        type: string
        default: 'windows-latest'
    secrets:
      # Packing restores as part of the same invocation, so it needs the same
      # cross-repo read capability as the build job. See the note in _build.yml:
      # the per-run token cannot read 'private' org packages. Publishing still uses
      # GITHUB_TOKEN, which is correct - a repo publishes only its own packages.
      PACKAGES_READ_TOKEN:
        description: 'Org-level PAT with read:packages, for private sibling packages'
        required: false

jobs:
  package:
    name: Package and Publish
    runs-on: ${{ inputs.runner-os }}
    timeout-minutes: 15
    if: inputs.packable-projects != '[]' && inputs.packable-projects != ''
    
    strategy:
      matrix:
        project: ${{ fromJson(inputs.packable-projects) }}

    env:
      # Pin the global packages folder so the cache path does not depend on the runner
      # image's default HOME layout.
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for MinVer

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      # Each matrix leg is its own runner and would otherwise restore from scratch.
      # See the comment in _build.yml for why setup-dotnet's `cache: true` is unusable.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Authenticate to GitHub Packages
        uses: EagleViewEnt/.github/.github/actions/authenticate-github-packages@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          packages-read-token: ${{ secrets.PACKAGES_READ_TOKEN }}
          org-name: 'EagleViewEnt'
      
      # A single pack invocation performs restore, build, and pack. Splitting these
      # apart breaks Razor class libraries: packing without a prior build cannot find
      # staticwebassets.build.json, while packing after a separate build re-runs static
      # web asset discovery over existing output and fails on the duplicated scoped CSS
      # bundle.
      - name: Pack project
        shell: pwsh
        run: |
          Write-Host "Packing: ${{ matrix.project }}"
          dotnet pack "${{ matrix.project }}" `
            --configuration ${{ inputs.build-config }} `
            --output ./artifacts


      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ hashFiles(matrix.project) }}
          path: ./artifacts/*.nupkg
          retention-days: 90
      
      - name: Push to GitHub Packages
        # Version tags are the ONLY release mechanism. dotnet-ci.yml treats refs/tags/v*
        # as a full build and MinVer derives the release version from the tag.
        #
        # refs/heads/main is deliberately excluded. A release tag points at the commit
        # that was just merged, so the main push and the tag push are the same SHA and
        # MinVer resolves both to the same version. Allowing main to publish meant two
        # concurrent runs packed identical artifacts and raced to push them to the same
        # feed (observed 24s apart on Blazor v1.4.1), surviving only because of
        # --skip-duplicate. Publishing now depends on intent -- tagging -- rather than on
        # which run happens to arrive first.
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (startsWith(github.ref, 'refs/tags/v') || contains(github.ref, '-v'))
        shell: pwsh
        run: |
          $source = "https://nuget.pkg.github.com/${{ inputs.org-name }}/index.json"

          # dotnet nuget push failures must fail the job. A non-zero exit inside
          # ForEach-Object does not stop the pipeline or set the script's exit code,
          # so a rejected push (for example a 403 when the package has not granted
          # this repository Actions access) previously reported success and the
          # release silently shipped without that package.
          $failed = @()

          function Push-Package {
            param([string] $Path, [string] $Label)

            Write-Host "Pushing $Label..."
            dotnet nuget push $Path --api-key ${{ secrets.GITHUB_TOKEN }} --source $source --skip-duplicate
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::Failed to push $Label (exit $LASTEXITCODE)."
              $script:failed += $Label
            }
          }

          Get-ChildItem artifacts -Filter *.nupkg | ForEach-Object {
            Push-Package -Path $_.FullName -Label $_.Name
          }
          Get-ChildItem artifacts -Filter *.snupkg | ForEach-Object {
            Push-Package -Path $_.FullName -Label "symbols $($_.Name)"
          }

          if ($failed.Count -gt 0) {
            Write-Host "::error::$($failed.Count) package(s) failed to push: $($failed -join ', ')"
            exit 1
          }
