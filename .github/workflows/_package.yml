name: Package

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: '.NET SDK version'
        required: true
        type: string
      build-config:
        description: 'Build configuration'
        required: true
        type: string
      packable-projects:
        description: 'JSON array of projects to package'
        required: true
        type: string
      org-name:
        description: 'Organization name for publishing'
        required: true
        type: string

jobs:
  package:
    name: Package and Publish
    runs-on: windows-latest  # Match the old workflow
    if: inputs.packable-projects != '[]' && inputs.packable-projects != ''
    
    strategy:
      matrix:
        project: ${{ fromJson(inputs.packable-projects) }}

    env:
      # Pin the global packages folder so the cache path does not depend on the runner
      # image's default HOME layout.
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for MinVer

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      # Each matrix leg is its own runner and would otherwise restore from scratch.
      # See the comment in _build.yml for why setup-dotnet's `cache: true` is unusable.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Authenticate to GitHub Packages
        uses: EagleViewEnt/.github/.github/actions/authenticate-github-packages@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          org-name: 'EagleViewEnt'
      
      # A single pack invocation performs restore, build, and pack. Splitting these
      # apart breaks Razor class libraries: packing without a prior build cannot find
      # staticwebassets.build.json, while packing after a separate build re-runs static
      # web asset discovery over existing output and fails on the duplicated scoped CSS
      # bundle.
      - name: Pack project
        shell: pwsh
        run: |
          Write-Host "Packing: ${{ matrix.project }}"
          dotnet pack "${{ matrix.project }}" `
            --configuration ${{ inputs.build-config }} `
            --output ./artifacts


      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ hashFiles(matrix.project) }}
          path: ./artifacts/*.nupkg
          retention-days: 90
      
      - name: Push to GitHub Packages
        # Version tags are the ONLY release mechanism. dotnet-ci.yml treats refs/tags/v*
        # as a full build and MinVer derives the release version from the tag.
        #
        # refs/heads/main is deliberately excluded. A release tag points at the commit
        # that was just merged, so the main push and the tag push are the same SHA and
        # MinVer resolves both to the same version. Allowing main to publish meant two
        # concurrent runs packed identical artifacts and raced to push them to the same
        # feed (observed 24s apart on Blazor v1.4.1), surviving only because of
        # --skip-duplicate. Publishing now depends on intent -- tagging -- rather than on
        # which run happens to arrive first.
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (startsWith(github.ref, 'refs/tags/v') || contains(github.ref, '-v'))
        shell: pwsh
        run: |
          $source = "https://nuget.pkg.github.com/${{ inputs.org-name }}/index.json"
          Get-ChildItem artifacts -Filter *.nupkg | ForEach-Object {
            Write-Host "Pushing $($_.Name)..."
            dotnet nuget push $_.FullName --api-key ${{ secrets.GITHUB_TOKEN }} --source $source --skip-duplicate
          }
          Get-ChildItem artifacts -Filter *.snupkg | ForEach-Object {
            Write-Host "Pushing symbols $($_.Name)..."
            dotnet nuget push $_.FullName --api-key ${{ secrets.GITHUB_TOKEN }} --source $source --skip-duplicate
          }
