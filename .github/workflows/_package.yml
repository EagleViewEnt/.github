name: Package

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: '.NET SDK version'
        required: true
        type: string
      build-config:
        description: 'Build configuration'
        required: true
        type: string
      packable-projects:
        description: 'JSON array of projects to package'
        required: true
        type: string
      org-name:
        description: 'Organization name for publishing'
        required: true
        type: string

jobs:
  package:
    name: Package and Publish
    runs-on: windows-latest  # Match the old workflow
    if: inputs.packable-projects != '[]' && inputs.packable-projects != ''
    
    strategy:
      matrix:
        project: ${{ fromJson(inputs.packable-projects) }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for MinVer
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
      
      - name: Authenticate to GitHub Packages
        run: |
          dotnet nuget remove source github 2>&1 || true
          dotnet nuget add source --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ inputs.org-name }}/index.json"
      
      - name: Pack project
        shell: pwsh
        run: |
          Write-Host "Packing: ${{ matrix.project }}"
          dotnet pack "${{ matrix.project }}" `
            --configuration ${{ inputs.build-config }} `
            --output ./artifacts
      
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ hashFiles(matrix.project) }}
          path: ./artifacts/*.nupkg
          retention-days: 90
      
      - name: Push to GitHub Packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $source = "https://nuget.pkg.github.com/${{ inputs.org-name }}/index.json"
          Get-ChildItem artifacts -Filter *.nupkg | ForEach-Object {
            Write-Host "Pushing $($_.Name)..."
            dotnet nuget push $_.FullName --api-key ${{ secrets.GITHUB_TOKEN }} --source $source --skip-duplicate
          }
          Get-ChildItem artifacts -Filter *.snupkg | ForEach-Object {
            Write-Host "Pushing symbols $($_.Name)..."
            dotnet nuget push $_.FullName --api-key ${{ secrets.GITHUB_TOKEN }} --source $source --skip-duplicate
          }
