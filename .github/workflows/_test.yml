name: Test

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: '.NET SDK version'
        required: true
        type: string
      build-config:
        description: 'Build configuration'
        required: true
        type: string
      code-coverage:
        description: 'Enable code coverage'
        required: false
        type: string
        default: 'false'

jobs:
  test:
    name: Run Tests
    runs-on: windows-latest  # Match the old workflow
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Build
        run: dotnet build --no-restore --configuration ${{ inputs.build-config }}
      
      - name: Run tests
        run: dotnet test --configuration ${{ inputs.build-config }} --no-build --verbosity normal --collect:"XPlat Code Coverage"
      
      - name: Upload coverage reports
        if: inputs.code-coverage == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: '**/TestResults/**/coverage.cobertura.xml'
