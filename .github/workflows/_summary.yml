name: Summary

on:
  workflow_call:
    inputs:
      mode:
        description: 'Workflow mode'
        required: true
        type: string
      dotnet-version:
        description: '.NET version'
        required: true
        type: string
      build-config:
        description: 'Build configuration'
        required: true
        type: string
      packable-projects:
        description: 'JSON array of packable projects'
        required: true
        type: string
      setup-result:
        description: 'Setup job result'
        required: true
        type: string
      build-result:
        description: 'Build job result'
        required: true
        type: string
      test-result:
        description: 'Test job result'
        required: true
        type: string
      package-result:
        description: 'Package job result'
        required: true
        type: string
      incremental-build:
        description: 'Whether incremental build was used'
        required: false
        type: string
        default: 'false'
      incremental-reason:
        description: 'Reason for build mode selection'
        required: false
        type: string
        default: ''
      changed-projects:
        description: 'JSON array of changed projects'
        required: false
        type: string
        default: '[]'

jobs:
  summary:
    name: Workflow Summary
    runs-on: windows-latest  # Use Windows for consistency
    if: always()
    
    steps:
      - name: Generate summary
        shell: pwsh
        run: |
          # Use here-string to safely handle JSON with special characters
          $packableProjectsJson = @'
          ${{ inputs.packable-projects }}
          '@
          
          $changedProjectsJson = @'
          ${{ inputs.changed-projects }}
          '@
          
          echo "## :clipboard: Workflow Summary" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "**Mode:** ${{ inputs.mode }}" >> $env:GITHUB_STEP_SUMMARY
          echo "**Configuration:** ${{ inputs.build-config }}" >> $env:GITHUB_STEP_SUMMARY
          echo "**.NET Version:** ${{ inputs.dotnet-version }}" >> $env:GITHUB_STEP_SUMMARY
          
          # Show build type and reason
          if ("${{ inputs.incremental-build }}" -eq "true") {
            echo "**Build Type:** :zap: Incremental (changed projects only)" >> $env:GITHUB_STEP_SUMMARY
          } else {
            echo "**Build Type:** :rocket: Full (all projects)" >> $env:GITHUB_STEP_SUMMARY
          }
          
          if ("${{ inputs.incremental-reason }}" -ne "") {
            echo "**Reason:** ${{ inputs.incremental-reason }}" >> $env:GITHUB_STEP_SUMMARY
          }
          
          echo "" >> $env:GITHUB_STEP_SUMMARY
          
          # Show changed projects if incremental
          if ("${{ inputs.incremental-build }}" -eq "true") {
            try {
              if (-not [string]::IsNullOrWhiteSpace($changedProjectsJson) -and $changedProjectsJson -ne "[]") {
                $projects = $changedProjectsJson | ConvertFrom-Json
                echo "### :file_folder: Changed Projects ($($projects.Count))" >> $env:GITHUB_STEP_SUMMARY
                echo "" >> $env:GITHUB_STEP_SUMMARY
                foreach ($proj in $projects) {
                  echo "- ``$proj``" >> $env:GITHUB_STEP_SUMMARY
                }
              } else {
                echo "### :information_source: No project changes detected" >> $env:GITHUB_STEP_SUMMARY
                echo "" >> $env:GITHUB_STEP_SUMMARY
                echo "No code changes found in this push." >> $env:GITHUB_STEP_SUMMARY
              }
            } catch {
              echo "### :file_folder: Changed Projects" >> $env:GITHUB_STEP_SUMMARY
              echo "" >> $env:GITHUB_STEP_SUMMARY
              echo "_(Error parsing project list)_" >> $env:GITHUB_STEP_SUMMARY
            }
            echo "" >> $env:GITHUB_STEP_SUMMARY
          }
          
          # Safely parse packable projects JSON
          try {
            if (-not [string]::IsNullOrWhiteSpace($packableProjectsJson) -and $packableProjectsJson -ne "[]") {
              $projects = $packableProjectsJson | ConvertFrom-Json
              echo "### :package: Packable Projects ($($projects.Count))" >> $env:GITHUB_STEP_SUMMARY
              echo "" >> $env:GITHUB_STEP_SUMMARY
              foreach ($proj in $projects) {
                echo "- ``$proj``" >> $env:GITHUB_STEP_SUMMARY
              }
            } else {
              echo "### :package: No packages configured" >> $env:GITHUB_STEP_SUMMARY
            }
          } catch {
            echo "### :package: Packable Projects" >> $env:GITHUB_STEP_SUMMARY
            echo "" >> $env:GITHUB_STEP_SUMMARY
            echo "_(Error parsing project list)_" >> $env:GITHUB_STEP_SUMMARY
          }
          
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "### :bar_chart: Job Status" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $env:GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $env:GITHUB_STEP_SUMMARY
          echo "| Setup | ${{ inputs.setup-result }} |" >> $env:GITHUB_STEP_SUMMARY
          echo "| Build | ${{ inputs.build-result }} |" >> $env:GITHUB_STEP_SUMMARY
          echo "| Test | ${{ inputs.test-result }} |" >> $env:GITHUB_STEP_SUMMARY
          echo "| Package | ${{ inputs.package-result }} |" >> $env:GITHUB_STEP_SUMMARY
