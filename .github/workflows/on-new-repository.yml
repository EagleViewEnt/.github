name: Setup New Repository

on:  
  repository:   
    types: [created]

jobs:  
  initialize-repo:
    runs-on: ubuntu-latest
    permissions:  
      contents: write
    
    steps:
      - name:  Checkout the new repository
        uses: actions/checkout@v4
        with:  
          repository: ${{ github.event.repository.full_name }}
          token: ${{ secrets.PAT_TOKEN }}
          
      - name: Create folder structure
        run: |
          mkdir -p docs
          mkdir -p scripts
          mkdir -p nupkgs
          mkdir -p tests
          mkdir -p src
          mkdir -p . github/workflows
          
      - name:  Create CI workflow
        run: |
          cat > .github/workflows/ci.yml << 'EOF'
          name: CI

          on:  
            pull_request:
              branches: [ main ]
            push:
              branches: [ main ]

          permissions:
            contents: read
            packages: write


          jobs:
            ci:
              uses: EagleViewEnt/. github/.github/workflows/reusable-dotnet-ci.yml@main
              with:
                dotnet-version: '10.0.x'
                build-configuration: 'Release'
                run-tests: true
                enable-code-coverage: true
                publish-packages: false
                package-projects: '[]'
                org-name: 'EagleViewEnt'
          EOF
          
      - name:  Create workflow config
        run: |
          cat > .github/workflow-config.json << 'EOF'
          {
            "workflow":  {
              "dotnet-version": "10.0.x",
              "build-configuration": "Release",
              "run-tests": true,
              "enable-code-coverage": true,
              "restore-retry-count": 3
            },
            "packages": {
              "publish":  true,
              "visibility": "internal",
              "repositories": []
            },
            "authentication": {
              "org-name": "EagleViewEnt",
              "additional-sources": []
            }
          }
          EOF
          
      - name: Create Visual Studio . gitignore
        run: |
          cat > .gitignore << 'EOF'
          ## Ignore Visual Studio temporary files, build results, and
          ## files generated by popular Visual Studio add-ons. 
          ##
          ## Get latest from https://github.com/github/gitignore/blob/main/VisualStudio.gitignore

          # User-specific files
          *.rsuser
          *. suo
          *.user
          *.userosscache
          *.sln.docstates

          # User-specific files (MonoDevelop/Xamarin Studio)
          *.userprefs

          # Mono auto generated files
          mono_crash.*

          # Build results
          [Dd]ebug/
          [Dd]ebugPublic/
          [Rr]elease/
          [Rr]eleases/
          x64/
          x86/
          [Ww][Ii][Nn]32/
          [Aa][Rr][Mm]/
          [Aa][Rr][Mm]64/
          bld/
          [Bb]in/
          [Oo]bj/
          [Ll]og/
          [Ll]ogs/

          # Visual Studio 2015/2017 cache/options directory
          .vs/
          # Uncomment if you have tasks that create the project's static files in wwwroot
          #wwwroot/

          # Visual Studio 2017 auto generated files
          Generated\ Files/

          # MSTest test Results
          [Tt]est[Rr]esult*/
          [Bb]uild[Ll]og.*

          # NUnit
          *.VisualState.xml
          TestResult.xml
          nunit-*.xml

          # Build Results of an ATL Project
          [Dd]ebugPS/
          [Rr]eleasePS/
          dlldata.c

          # Benchmark Results
          BenchmarkDotNet.Artifacts/

          # .NET Core
          project.lock.json
          project.fragment.lock.json
          artifacts/

          # ASP. NET Scaffolding
          ScaffoldingReadMe.txt

          # StyleCop
          StyleCopReport.xml

          # Files built by Visual Studio
          *_i.c
          *_p. c
          *_h.h
          *.ilk
          *.meta
          *.obj
          *.iobj
          *.pch
          *.pdb
          *.ipdb
          *.pgc
          *.pgd
          *.rsp
          *.sbr
          *.tlb
          *.tli
          *.tlh
          *.tmp
          *.tmp_proj
          *_wpftmp.csproj
          *.log
          *.tlog
          *.vspscc
          *.vssscc
          .builds
          *.pidb
          *.svclog
          *.scc

          # Chutzpah Test files
          _Chutzpah*

          # Visual C++ cache files
          ipch/
          *.aps
          *.ncb
          *.opendb
          *.opensdf
          *.sdf
          *.cachefile
          *.VC.db
          *.VC.VC.opendb

          # Visual Studio profiler
          *.psess
          *.vsp
          *. vspx
          *.sap

          # Visual Studio Trace Files
          *.e2e

          # TFS 2012 Local Workspace
          $tf/

          # Guidance Automation Toolkit
          *.gpState

          # ReSharper is a .NET coding add-in
          _ReSharper*/
          *.[Rr]e[Ss]harper
          *.DotSettings.user

          # TeamCity is a build add-in
          _TeamCity*

          # DotCover is a Code Coverage Tool
          *.dotCover

          # AxoCover is a Code Coverage Tool
          . axoCover/*
          !. axoCover/settings.json

          # Coverlet is a free, cross platform Code Coverage Tool
          coverage*.json
          coverage*.xml
          coverage*.info

          # Visual Studio code coverage results
          *.coverage
          *.coveragexml

          # NCrunch
          _NCrunch_*
          .*crunch*.local. xml
          nCrunchTemp_*

          # MightyMoose
          *.mm.*
          AutoTest. Net/

          # Web workbench (sass)
          .sass-cache/

          # Installshield output folder
          [Ee]xpress/

          # DocProject is a documentation generator add-in
          DocProject/buildhelp/
          DocProject/Help/*.HxT
          DocProject/Help/*.HxC
          DocProject/Help/*.hhc
          DocProject/Help/*. hhk
          DocProject/Help/*.hhp
          DocProject/Help/Html2
          DocProject/Help/html

          # Click-Once directory
          publish/

          # Publish Web Output
          *.[Pp]ublish.xml
          *.azurePubxml
          # Note: Comment the next line if you want to checkin your web deploy settings,
          # but database connection strings (with potential passwords) will be unencrypted
          *.pubxml
          *.publishproj

          # Microsoft Azure Web App publish settings. Comment the next line if you want to
          # checkin your Azure Web App publish settings, but sensitive information contained
          # in these scripts will be unencrypted
          PublishScripts/

          # NuGet Packages
          *.nupkg
          # NuGet Symbol Packages
          *.snupkg
          # The packages folder can be ignored because of Package Restore
          **/[Pp]ackages/*
          # except build/, which is used as an MSBuild target.
          !**/[Pp]ackages/build/
          # Uncomment if necessary however generally it will be regenerated when needed
          #!**/[Pp]ackages/repositories. config
          # NuGet v3's project. json files produces more ignorable files
          *.nuget.props
          *.nuget.targets

          # Microsoft Azure Build Output
          csx/
          *.build.csdef

          # Microsoft Azure Emulator
          ecf/
          rcf/

          # Windows Store app package directories and files
          AppPackages/
          BundleArtifacts/
          Package.StoreAssociation.xml
          _pkginfo.txt
          *.appx
          *.appxbundle
          *.appxupload

          # Visual Studio cache files
          # files ending in .cache can be ignored
          *.[Cc]ache
          # but keep track of directories ending in .cache
          !? *.[Cc]ache/

          # Others
          ClientBin/
          ~$*
          *~
          *.dbmdl
          *.dbproj. schemaview
          *.jfm
          *.pfx
          *.publishsettings
          orleans.codegen.cs

          # Including strong name files can present a security risk
          # (https://github.com/github/gitignore/pull/2483#issue-259490424)
          #*.snk

          # Since there are multiple workflows, uncomment next line to ignore bower_components
          # (https://github.com/github/gitignore/pull/1529#issuecomment-104372622)
          #bower_components/

          # RIA/Silverlight projects
          Generated_Code/

          # Backup & report files from converting an old project file
          # to a newer Visual Studio version. Backup files are not needed,
          # because we have git ;-)
          _UpgradeReport_Files/
          Backup*/
          UpgradeLog*.XML
          UpgradeLog*.htm
          ServiceFabricBackup/
          *.rptproj. bak

          # SQL Server files
          *.mdf
          *.ldf
          *. ndf

          # Business Intelligence projects
          *.rdl.data
          *.bim.layout
          *.bim_*.settings
          *.rptproj.rsuser
          *-[Bb]ackup.rdl
          *-[Bb]ackup ([0-9]).rdl
          *-[Bb]ackup ([0-9][0-9]).rdl

          # Microsoft Fakes
          FakesAssemblies/

          # GhostDoc plugin setting file
          *.GhostDoc.xml

          # Node. js Tools for Visual Studio
          . ntvs_analysis.dat
          node_modules/

          # Visual Studio 6 build log
          *.plg

          # Visual Studio 6 workspace options file
          *.opt

          # Visual Studio 6 auto-generated workspace file (contains which files were open etc.)
          *.vbw

          # Visual Studio 6 auto-generated project file (contains which files were open etc.)
          *.vbp

          # Visual Studio 6 workspace and project file (working project files containing files to include in project)
          *.dsw
          *.dsp

          # Visual Studio 6 technical files
          *.ncb
          *.aps

          # Visual Studio LightSwitch build output
          **/*.HTMLClient/GeneratedArtifacts
          **/*.DesktopClient/GeneratedArtifacts
          **/*.DesktopClient/ModelManifest.xml
          **/*.Server/GeneratedArtifacts
          **/*. Server/ModelManifest.xml
          _Pvt_Extensions

          # Paket dependency manager
          .paket/paket.exe
          paket-files/

          # FAKE - F# Make
          .fake/

          # CodeRush personal settings
          .cr/personal

          # Python Tools for Visual Studio (PTVS)
          __pycache__/
          *.pyc

          # Cake - Uncomment if you are using it
          # tools/**
          # !tools/packages. config

          # Tabs Studio
          *.tss

          # Telerik's JustMock configuration file
          *.jmconfig

          # BizTalk build output
          *.btp.cs
          *.btm.cs
          *.odx.cs
          *.xsd.cs

          # OpenCover UI analysis results
          OpenCover/

          # Azure Stream Analytics local run output
          ASALocalRun/

          # MSBuild Binary and Structured Log
          *.binlog

          # NVidia Nsight GPU debugger configuration file
          *.nvuser

          # MFractors (Xamarin productivity tool) working folder
          . mfractor/

          # Local History for Visual Studio
          .localhistory/

          # Visual Studio History (VSHistory) files
          .vshistory/

          # BeatPulse healthcheck temp database
          healthchecksdb

          # Backup folder for Package Reference Convert tool in Visual Studio 2017
          MigrationBackup/

          # Ionide (cross platform F# VS Code tools) working folder
          . ionide/

          # Fody - auto-generated XML schema
          FodyWeavers.xsd

          # VS Code files for those working on multiple tools
          . vscode/*
          !.vscode/settings.json
          ! .vscode/tasks.json
          !.vscode/launch. json
          !.vscode/extensions.json
          *.code-workspace

          # Local History for Visual Studio Code
          .history/

          # Windows Installer files from build outputs
          *.cab
          *.msi
          *.msix
          *.msm
          *. msp

          # JetBrains Rider
          *.sln.iml
          . idea/
          EOF
          
      - name: Create LICENSE. txt
        run: |
          cat > LICENSE.txt << 'EOF'
          LICENSE (Proprietary)

          Copyright (c) 2025 EagleViewEnt.  All rights reserved.

          1) Ownership
          This software (the "Software") is the exclusive property of EagleViewEnt. 

          2) Permitted Use
          Use is permitted solely within the scope of agreements with EagleViewEnt. 
          No license is granted to copy, modify, merge, publish, distribute, sublicense, sell, or create derivative works outside authorized agreements. 

          3) Derivative Works
          Any modifications or derivative works become the exclusive property of EagleViewEnt. 

          4) Disclaimer of Warranty
          THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR IMPLIED. 

          5) Limitation of Liability
          In no event shall EagleViewEnt be liable for any claim, damages, or other liability arising from the Software. 

          6) Governing Law
          This License is governed by the laws applicable to agreements with EagleViewEnt. 

          Proprietary and Confidential — Unauthorized use is prohibited.
          EOF
          
      - name: Create NOTICE.md
        run: |
          cat > NOTICE.md << 'EOF'
          # NOTICE

          Copyright (c) 2025 EagleViewEnt. 
          All rights reserved.

          This repository is part of the EagleViewEnt **TaxStationPro** platform and may contain components licensed under separate terms by their respective authors. 

          Where applicable, third-party components are credited below.  If you believe attribution is missing or incomplete, please contact EagleViewEnt.

          ## Third-Party Notices

          - Microsoft . NET SDKs and packages © Microsoft Corporation — Licensed under their respective licenses.
          - YamlDotNet © Contributors — Licensed under the MIT License.
          - Other transitive dependencies — See package metadata in `Directory. Packages.props` and NuGet package pages. 

          This software and all modifications remain the exclusive property of EagleViewEnt per the accompanying `LICENSE.txt`.
          EOF
          
      - name: Create placeholder files in folders
        run: |
          echo "# Documentation" > docs/README.md
          echo "# Scripts" > scripts/README.md
          echo "# NuGet Packages" > nupkgs/README.md
          echo "This folder contains generated NuGet packages." >> nupkgs/README. md
          echo "# Tests" > tests/README.md
          echo "# Source Code" > src/README.md
          
      - name: Create repository README.md
        run: |
          cat > README.md << 'EOF'
          # ${{ github.event.repository.name }}

          ## Description

          Add a description of your project here.

          ## Getting Started

          ### Prerequisites

          - .NET 10.0 SDK or later
          - Visual Studio 2022 or later (recommended)

          ### Building

          ```bash
          dotnet restore
          dotnet build
          ```

          ### Testing

          ```bash
          dotnet test
          ```

          ## Project Structure

          ```
          .
          ├── docs/          # Documentation
          ├── scripts/       # Build and utility scripts
          ├── nupkgs/        # Generated NuGet packages
          ├── src/           # Source code
          └── tests/         # Test projects
          ```

          ## Contributing

          Please follow the organization's contribution guidelines.

          ## License

          See [LICENSE.txt](LICENSE.txt) for details.
          EOF
          
      - name:  Commit and push all files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Initialize repository with standard structure and files"
          git push
