name: Build and Test

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: '.NET SDK version'
        required: true
        type: string
      build-config:
        description: 'Build configuration (Debug/Release)'
        required: true
        type: string
      filter-projects:
        description: 'JSON array of specific projects to build (empty = build all)'
        required: false
        type: string
        default: '[]'
      runner-os:
        description: 'Runner image to execute this job on'
        required: false
        type: string
        default: 'windows-latest'
      run-tests:
        description: 'Whether to run tests after building'
        required: false
        type: string
        default: 'true'
      code-coverage:
        description: 'Enable code coverage'
        required: false
        type: string
        default: 'false'
      test-filter-projects:
        description: 'JSON array of specific test projects to run (empty = test all)'
        required: false
        type: string
        default: '[]'

jobs:
  build:
    # Build and test share one job deliberately. They previously ran as two reusable
    # workflows, which meant two runners, two checkouts, two SDK installs, two cache
    # restores, two package authentications - and, because compiled output cannot cross
    # a job boundary without an artifact round-trip, two full compiles of the same code.
    # The test job then built the ENTIRE solution even when the build job had been
    # restricted to the changed projects, so it was doing strictly more work than the
    # job it nominally depended on. See EagleViewEnt/.github#7.
    name: Build and Test
    runs-on: ${{ inputs.runner-os }}

    env:
      # Pin the global packages folder so the cache path does not depend on the runner
      # image's default HOME layout.
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      # setup-dotnet's built-in `cache: true` is not usable here: it requires
      # packages.lock.json, which no EagleViewEnt repo generates. Every repo does use
      # Central Package Management, so Directory.Packages.props plus the project files
      # fully describe the dependency graph and make a sound cache key.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Authenticate to GitHub Packages
        uses: EagleViewEnt/.github/.github/actions/authenticate-github-packages@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          org-name: 'EagleViewEnt'
      
      - name: Resolve solution
        id: sln
        shell: pwsh
        run: |
          # A bare 'dotnet build' fails with MSB1011 when a repo contains more than one
          # solution file, so pick one explicitly and prefer the repo-named solution.
          $solutions = @(Get-ChildItem -Filter *.sln -File)
          if ($solutions.Count -eq 0) { $solutions = @(Get-ChildItem -Filter *.slnx -File) }
          if ($solutions.Count -eq 0) {
            Write-Error "No solution file found in the repository root."
            exit 1
          }
          $repo = "${{ github.event.repository.name }}"
          $chosen = $solutions | Where-Object { $_.BaseName -match [regex]::Escape($repo) } | Select-Object -First 1
          if (-not $chosen) { $chosen = $solutions | Sort-Object Name | Select-Object -First 1 }
          Write-Host "Using solution: $($chosen.Name)"
          "path=$($chosen.Name)" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore "${{ steps.sln.outputs.path }}"
      
      - name: Build
        shell: pwsh
        run: |
          $filterProjects = '${{ inputs.filter-projects }}'
          $testProjects = '${{ inputs.test-filter-projects }}'

          if ($filterProjects -and $filterProjects -ne '[]') {
            Write-Host "⚡ Incremental Build Mode"
            Write-Host "Building specific projects only..."
            Write-Host ""

            $projects = @($filterProjects | ConvertFrom-Json)

            # The test step runs with --no-build, so anything it intends to execute must
            # be compiled here. Test projects are not necessarily in the changed set:
            # changing a source project selects its associated test project for testing
            # without adding it to filter-projects.
            if ($testProjects -and $testProjects -ne '[]') {
              $projects += @($testProjects | ConvertFrom-Json)
            }

            $projects = @($projects | Select-Object -Unique)

            foreach ($project in $projects) {
              Write-Host "🔨 Building: $project"
              dotnet build "$project" --no-restore --configuration ${{ inputs.build-config }}

              if ($LASTEXITCODE -ne 0) {
                Write-Error "Build failed for: $project"
                exit $LASTEXITCODE
              }
            }
          } else {
            Write-Host "🚀 Full Build Mode"
            Write-Host "Building entire solution..."
            dotnet build "${{ steps.sln.outputs.path }}" --no-restore --configuration ${{ inputs.build-config }}
          }

      - name: Run tests
        if: inputs.run-tests == 'true'
        shell: pwsh
        run: |
          $filterProjects = '${{ inputs.test-filter-projects }}'
          $buildFilter = '${{ inputs.filter-projects }}'

          if ($buildFilter -and $buildFilter -ne '[]') {
            Write-Host "⚡ Incremental Test Mode"
            Write-Host ""

            $projects = @($filterProjects | ConvertFrom-Json)

            if ($projects.Count -eq 0) {
              Write-Host "ℹ️ No test projects in changed set. Skipping tests."
              exit 0
            }

            Write-Host "🧪 Running tests for $($projects.Count) project(s)"
            Write-Host ""

            foreach ($project in $projects) {
              Write-Host "▶️ Testing: $project"
              dotnet test "$project" `
                --configuration ${{ inputs.build-config }} `
                --no-build `
                --verbosity normal `
                --collect:"XPlat Code Coverage"

              if ($LASTEXITCODE -ne 0) {
                Write-Error "Tests failed for: $project"
                exit $LASTEXITCODE
              }
            }
          } else {
            Write-Host "🚀 Full Test Mode"
            Write-Host "Testing entire solution..."
            dotnet test "${{ steps.sln.outputs.path }}" `
              --configuration ${{ inputs.build-config }} `
              --no-build `
              --verbosity normal `
              --collect:"XPlat Code Coverage"
          }

      - name: Upload coverage reports
        if: inputs.run-tests == 'true' && inputs.code-coverage == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: '**/TestResults/**/coverage.cobertura.xml'
