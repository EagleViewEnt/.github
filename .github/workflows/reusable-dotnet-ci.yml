name: Reusable .NET CI Workflow

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: '.NET SDK version to use'
        required: false
        type: string
        default: '10.0.x'
      build-configuration:
        description: 'Build configuration (Debug/Release)'
        required: false
        type: string
        default: 'Release'
      run-tests:
        description: 'Whether to run tests'
        required: false
        type: boolean
        default: true
      enable-code-coverage:
        description: 'Enable code coverage collection'
        required: false
        type: boolean
        default: true
      publish-packages:
        description: 'Whether to publish NuGet packages'
        required: false
        type: boolean
        default: true
      package-projects:
        description: 'List of projects to pack (JSON array of paths)'
        required: false
        type: string
        default: '[]'
      org-name:
        description: 'GitHub organization name'
        required: false
        type: string
        default: 'EagleViewEnt'
      package-access-config:
        description: 'Path to package access configuration file'
        required: false
        type: string
        default: '.github/workflow-config.json'
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Authenticate to GitHub Packages
        run: |
          dotnet nuget remove source github 2>&1 || true
          dotnet nuget add source --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ inputs.org-name }}/index.json"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c ${{ inputs.build-configuration }} --no-restore

      - name: Test
        if: ${{ inputs.run-tests }}
        run: dotnet test -c ${{ inputs.build-configuration }} --no-build --verbosity normal --collect:"XPlat Code Coverage"

      - name: Upload coverage
        if: ${{ inputs.run-tests && inputs.enable-code-coverage }}
        uses: codecov/codecov-action@v4
        with:
          directory: ./tests
          files: '**/coverage.cobertura.xml'
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Pack NuGet packages
        if: ${{ inputs.publish-packages && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $projects = '${{ inputs.package-projects }}' | ConvertFrom-Json
          if ($projects.Count -eq 0) {
            Write-Host "Packing all packable projects..."
            dotnet pack -c ${{ inputs.build-configuration }} -o artifacts --no-build
          } else {
            foreach ($project in $projects) {
              Write-Host "Packing: $project"
              dotnet pack "$project" -c ${{ inputs.build-configuration }} -o artifacts --no-build
            }
          }

      - name: Push to GitHub Packages
        if: ${{ inputs.publish-packages && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: pwsh
        run: |
          $source = "https://nuget.pkg.github.com/${{ inputs.org-name }}/index.json"
          Get-ChildItem artifacts -Filter *.nupkg | ForEach-Object {
            Write-Host "Pushing $($_.Name)..."
            dotnet nuget push $_.FullName --api-key ${{ secrets.GITHUB_TOKEN }} --source $source --skip-duplicate
          }
          Get-ChildItem artifacts -Filter *.snupkg | ForEach-Object {
            Write-Host "Pushing symbols $($_.Name)..."
            dotnet nuget push $_.FullName --api-key ${{ secrets.GITHUB_TOKEN }} --source $source --skip-duplicate
          }
